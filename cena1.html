<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Cena 1 — Laboratório da UFMA</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div>
    <div class="title">Entre Micelas e Matracas</div>
    <div class="subtitle">Cena 1: Laboratório da UFMA</div>
  </div>
  <button class="btn" id="btnReiniciar">Reiniciar</button>
</header>

<main class="main">
  <!-- HUD / dica -->
  <div class="hud">
    <div class="hint" id="hint">
      💡 Clique nos itens necessários: jaleco, frascos de coleta, reagentes e equipamentos de campo.
    </div>
  </div>

  <div class="scene" id="scene">
    <!-- Fundo do laboratório -->
    <img
      class="bg"
      src="assets/bg/cenário 1.png"
      alt="Laboratório de química da UFMA"
      id="bg-lab"
    />

    <!-- Hotspots principais -->
    <div id="hs-jaleco"      class="hotspot"></div>
    <div id="hs-frascos"     class="hotspot"></div>
    <div id="hs-reagentes"   class="hotspot"></div>
    <div id="hs-checklist"   class="hotspot"></div>

    <!-- Equipamentos de campo -->
    <div id="hs-equip-prancheta"  class="hotspot"></div>
    <div id="hs-equip-frascos"    class="hotspot"></div>
    <div id="hs-equip-medidor"    class="hotspot"></div>
    <div id="hs-equip-termometro" class="hotspot"></div>

    <!-- NOVO: distrações do laboratório -->
    <div id="hs-residuos"   class="hotspot"></div>  <!-- frascos da prateleira -->
    <div id="hs-microondas" class="hotspot"></div>
    <div id="hs-cafe"       class="hotspot"></div>
    <div id="hs-plantas"    class="hotspot"></div>

    <!-- NOVO: vídeo de transição para a investigação -->
    <video id="viagemVideo" class="scene-video">
      <source src="assets/viagem.mp4" type="video/mp4" />
    </video>
  </div>

  <!-- Pop-up de informação do item -->
  <div class="info-popup-backdrop" id="infoBackdrop">
    <div class="info-popup" id="infoPopup">
      <div class="info-popup-header">
        <span id="infoTitle"></span>
        <button class="info-popup-close" id="infoClose">✕</button>
      </div>
      <div class="info-popup-body">
        <p id="infoGeneral"></p>
        <p id="infoUse"></p>

        <!-- Botões de decisão -->
        <div class="info-popup-actions">
          <button class="btn" id="btnLevar">Levar para o campo</button>
          <button class="btn" id="btnNaoLevar">Não levar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Overlay de resultado / ranking -->
  <div class="resultado-overlay" id="resultadoOverlay">
    <!-- Fogos ocupando toda a área do overlay -->
    <div id="fogosContainer"></div>

    <div class="resultado-card">
      <h2>Preparação para o campo</h2>
      <p id="resultadoPontuacao"></p>
      <p id="resultadoRanking"></p>

      <div class="trofeu-wrap">
        <span id="trofeuIcon">🏆</span>
      </div>

      <!-- Grupo de botões -->
      <div class="resultado-actions">
        <button class="btn" id="btnFecharResultado">Fechar</button>
        <button class="btn" id="btnIrInvestigacao">Ir para a investigação</button>
      </div>
    </div>
  </div>
</main>

<script type="module">
  import { initCena1 } from "./engine.js";
  initCena1();
</script>
</body>
</html>
