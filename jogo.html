<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Sala da Pesquisadora</title>
  <link rel="stylesheet" href="style.css">
</head>

<body data-scene="cena0" data-bgm="trilha1">
<header>
  <div>
    <div class="title">Entre Micelas e Matracas</div>
    <div class="subtitle">Sala da Pesquisadora</div>
  </div>
  <button class="btn" id="btnReiniciar" type="button">Reiniciar</button>
</header>

<main class="main">
  <div class="hud">
    <div class="hint" id="hint">
      💡 Clique no ícone próximo ao notebook para ler o e-mail. (Tecle G para ver áreas)!!!
    </div>
  </div>

  <div class="scene" id="scene">
    <img class="bg"
         src="../../assets/bg/cenario_sala.png"
         alt="Sala da pesquisadora com vista para o mar"
         id="bg"/>

    <video id="introVideo" class="scene-video" playsinline>
      <source src="../../assets/bg/animação.mp4" type="video/mp4">
    </video>

    <div id="hs-email" class="hotspot" title="Abrir e-mail"></div>

    <img id="emailIcon" class="email-icon"
         src="../../assets/bg/email.png"
         alt="Abrir e-mail">

    <div class="pixel-win" id="emailWin" role="dialog" aria-modal="true">
      <div class="pixel-title">
        INBOX — UFMA
        <span class="pixel-close" id="closeMail">✕</span>
      </div>
      <div class="pixel-body">
        <p><strong>De:</strong> coord.extensao@ufma.br</p>
        <p><strong>Assunto:</strong> Pedido urgente — alterações preocupantes no igarapé</p>
        <p id="mailText"></p>
        <div class="pixel-actions">
          <button class="btn" id="acceptCase" type="button">ACEITAR INVESTIGAÇÃO</button>
        </div>
      </div>
    </div>
  </div>
</main>

<!-- Ajuste os caminhos se necessário (raiz vs subpasta) -->
<script src="sfx.js" defer></script>
<script src="audio.js" defer></script>

<script type="module">
  import { initCena0 } from "./engine.js";
  initCena0();

  // =========================
  // CONFIG: PRÓXIMA CENA
  // =========================
  // ✅ AJUSTE ESTE CAMINHO para onde está seu cena1.html
  // Exemplos comuns:
  // const NEXT_SCENE_URL = "cena1.html";
  // const NEXT_SCENE_URL = "../cena1/cena1.html";
  const NEXT_SCENE_URL = "cena1.html";

  // ===== Ocultar header/HUD SOMENTE durante o vídeo desta cena
  // + parar a música durante o vídeo
  const video = document.getElementById("introVideo");

  const setVideoMode = (on) => {
    document.body.classList.toggle("is-video-playing", !!on);
  };

  const stopBgm = () => window.EMM_BGM?.stop();

  if (video) {
    // ao iniciar o vídeo, para o BGM
    video.addEventListener("play", () => { setVideoMode(true); stopBgm(); });
    video.addEventListener("playing", () => { setVideoMode(true); stopBgm(); });

    // se pausar/erro, só volta o HUD (não religa música aqui)
    video.addEventListener("pause", () => setVideoMode(false));
    video.addEventListener("error", () => setVideoMode(false));

    // ✅ ao terminar, garante navegação para a próxima cena
    video.addEventListener("ended", () => {
      setVideoMode(false);
      window.location.href = NEXT_SCENE_URL;
    });
  }
</script>

</body>
</html>
